    <clipPath id="ile"><path id="cote" d="M250 125 C330 75 470 62 560 92 C640 118 705 160 745 215 L772 232 L760 252 C790 310 782 385 742 445 C700 505 632 545 542 550 C452 556 362 540 292 502 C222 462 172 402 162 322 C152 242 182 162 250 125 Z"/></clipPath>
